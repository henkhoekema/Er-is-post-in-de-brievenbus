  - id: brievenbus_post_gedetecteerd
    alias: Brievenbus - Post gedetecteerd
    initial_state: true
    description: >
      Registreert nieuwe post alleen wanneer de klep beweegt,
      de deur gesloten is en er niet recent een deuropening is geweest.
      Zo worden bewegingen van de eigen hand tijdens het controleren
      van de brievenbus niet als postbezorging geregistreerd.
    triggers:
      - trigger: state
        entity_id: binary_sensor.brievenbus_klep
        from: "off"
        to: "on"
    conditions:
      # Voorkom dubbele postmeldingen binnen 60 seconden
      # (Contactdender-onderdrukking)
      - condition: template
        value_template: >
          {% set laatste = states('input_datetime.brievenbus_laatste_detectie') %}
          {{ laatste in ['unknown','unavailable','none','']
             or (as_timestamp(now()) -
             as_timestamp(laatste,0)) >= 60 }}
    actions:
      # Wacht 3 seconden zodat een deuropening geregistreerd kan worden
      - delay:
          seconds: 3
      # Negeer beweging als de deur nog openstaat
      - condition: state
        entity_id: binary_sensor.brievenbus_deur
        state: "off"

      # In dit geval staat de onderstaande conditie bewust onder actions, en dat is correct.
      # Het verschil zit in wanneer Home Assistant de controle moet uitvoeren.
      # Onder conditions worden de voorwaarden gecontroleerd voordat de automation begint.
      # Op dat moment is de deuropening mogelijk nog niet geregistreerd omdat
      # we de klepsensor eerst 15 seconden de tijd willen geven.

      # Negeer beweging binnen 15 seconden na de laatste deuropening
      - condition: template
        value_template: >
          {% set deur = states('input_datetime.brievenbus_laatste_deuropening') %}
          {{ deur in ['unknown','unavailable','none','']
             or (as_timestamp(now()) -
             as_timestamp(deur,0)) > 15 }}
      # Registreer de post
      - action: counter.increment
        target:
          entity_id: counter.brievenbus_post_vandaag
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.brievenbus_laatste_detectie
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.brievenbus_afgehandeld
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.brievenbus_onderweg
      - action: script.turn_off
        target:
          entity_id: script.brievenbus_notificaties
      - action: notify.mobile_app_<persoon1_id_here>
        data:
          message: clear_notification
          data:
            tag: brievenbus
      - action: notify.mobile_app_<persoon2_id_here>
        data:
          message: clear_notification
          data:
            tag: brievenbus
      # Alleen direct meldingen sturen tussen 07:00 en 22:00
      - choose:
          - conditions:
              - condition: time
                after: "07:00:00"
                before: "22:00:00"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.brievenbus_notificaties
    trace:
      stored_traces: 10
    mode: single


# Henk drukt JA
  - id: brievenbus_henk_ja
    alias: Brievenbus - Henk ja
    initial_state: true
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: BRIEVENBUS_HENK_JA
    actions:
      - action: notify.mobile_app_<persoon2_id_here>
        data:
          title: "📬 Brievenbus"
          message: "Henk gaat de brievenbus legen."
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.brievenbus_onderweg
    trace:
      stored_traces: 10
    mode: single


