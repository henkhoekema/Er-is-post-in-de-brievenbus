# Deze automation controleert elke ochtend om 07:00 of er nog niet-afgehandelde post aanwezig is.
  - id: brievenbus_ochtendcontrole
    alias: Brievenbus - Ochtendcontrole
    initial_state: true
    triggers:
      - trigger: time
        at: "07:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.brievenbus_afgehandeld
        state: "off"
      - condition: numeric_state
        entity_id: counter.brievenbus_post_vandaag
        above: 0
    actions:
      - action: script.turn_on
        target:
          entity_id: script.brievenbus_notificaties
    trace:
      stored_traces: 10
    mode: single


  - id: brievenbus_deur_geopend
    alias: Brievenbus - Deur geopend
    initial_state: true
    triggers:
      - trigger: state
        entity_id: binary_sensor.brievenbus_deur
        from: "off"
        to: "on"
        for:
          seconds: 2
    conditions:
      # Alleen als er daadwerkelijk post aanwezig is
      - condition: state
        entity_id: input_boolean.brievenbus_afgehandeld
        state: "off"
      - condition: numeric_state
        entity_id: counter.brievenbus_post_vandaag
        above: 0
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.brievenbus_onderweg
      - action: script.turn_on
        target:
          entity_id: script.brievenbus_afhandelen
    trace:
      stored_traces: 10
    mode: single


  - id: brievenbus_onderweg_controle
