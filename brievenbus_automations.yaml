  - id: brievenbus_laatste_deuropening
    alias: Brievenbus - Laatste deuropening registreren
    initial_state: true
    description: >
      Registreert het tijdstip waarop de brievenbusdeur wordt geopend.
      Dit tijdstip wordt gebruikt om te bepalen of een klepbeweging
      binnen 3 seconden gevolgd wordt door het openen van de deur,
      zodat een eigen controle van de brievenbus niet als postbezorging
      wordt geregistreerd.
    triggers:
      - trigger: state
        entity_id: binary_sensor.brievenbus_deur
        from: "off"
        to: "on"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.brievenbus_laatste_deuropening
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    trace:
      stored_traces: 10
    mode: restart